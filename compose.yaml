x-app: &app
  build: .
  image: ai-grading-portfolio:local
  env_file: .env
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  pids_limit: 128
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: grader
      POSTGRES_DB: grader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U grader -d grader"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    <<: *app
    command: [python, manage.py, migrate, --noinput]
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    <<: *app
    command: [celery, -A, config, worker, --loglevel=INFO, --concurrency=2, --hostname=worker@%h]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "celery -A config inspect ping -d worker@$$HOSTNAME --timeout=3 | grep -q pong"]
      interval: 30s
      timeout: 8s
      retries: 3
  beat:
    <<: *app
    command: [celery, -A, config, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  pgdata:
  redisdata:
