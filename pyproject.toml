[project]
name = "ai-grading-portfolio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Django>=5.2,<5.3", "djangorestframework>=3.16,<4", "djangorestframework-simplejwt>=5.5,<6", "psycopg[binary]>=3.2,<4", "celery>=5.5,<6", "redis>=6,<8", "dj-database-url>=3,<4", "gunicorn>=23,<24", "httpx>=0.28,<1", "pydantic>=2.11,<3"]
[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.11", "pytest-cov>=6", "ruff>=0.12", "pip-audit>=2.9"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
